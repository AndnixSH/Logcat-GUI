# Builds and tests on every platform, and packages native installers.
#
# Installers come from jpackage, which can only build for the OS and CPU it runs on, so
# each target gets its own runner. Pushing a tag like `v1.0.0` also publishes the
# installers as a GitHub release.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            tasks: packageMsi
            artifact: windows-x64
          - name: macOS arm64 (Apple silicon)
            runner: macos-15
            tasks: packageDmg
            artifact: macos-arm64
          - name: macOS x64 (Intel)
            runner: macos-15-intel
            tasks: packageDmg
            artifact: macos-x64
          - name: Linux x64
            runner: ubuntu-24.04
            tasks: packageDeb packageRpm
            artifact: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            tasks: packageDeb packageRpm
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Test
        run: ./gradlew test --console=plain

      - name: Package
        run: ./gradlew ${{ matrix.tasks }} --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: logcat-gui-${{ matrix.artifact }}
          path: build/compose/binaries/main/*/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Installer names don't include the CPU, so add it before uploading.
      - name: Name installers by platform
        run: |
          mkdir release
          # Each artifact keeps jpackage's msi/, dmg/, deb/, rpm/ subfolders.
          for dir in dist/logcat-gui-*; do
            platform="${dir#dist/logcat-gui-}"
            find "$dir" -type f | while read -r file; do
              name="$(basename "$file")"
              cp "$file" "release/${name%.*}-${platform}.${name##*.}"
            done
          done
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
