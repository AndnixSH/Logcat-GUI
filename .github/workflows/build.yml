# Builds and tests on every platform, and packages a portable build for each.
#
# A portable build is the app folder with its own trimmed Java runtime: unpack and run,
# nothing to install. jpackage can only build for the OS and CPU it runs on, so each
# target gets its own runner. Pushing a tag like `v1.0.0` also publishes the archives
# as a GitHub release.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            archive: LogcatGUI-windows-x64.zip
          - name: macOS arm64 (Apple silicon)
            runner: macos-15
            archive: LogcatGUI-macos-arm64.zip
          - name: macOS x64 (Intel)
            runner: macos-15-intel
            archive: LogcatGUI-macos-x64.zip
          - name: Linux x64
            runner: ubuntu-24.04
            archive: LogcatGUI-linux-x64.tar.gz
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            archive: LogcatGUI-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --console=plain

      - name: Build the portable app
        run: ./gradlew createDistributable --console=plain

      # Archive here instead of letting upload-artifact zip the folder: its zip drops
      # the executable bits that macOS and Linux need.
      - name: Archive
        run: |
          cd build/compose/binaries/main/app
          ls -l
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "$GITHUB_WORKSPACE/${{ matrix.archive }}" ./* ;;
            macOS)   ditto -c -k --keepParent ./*.app "$GITHUB_WORKSPACE/${{ matrix.archive }}" ;;
            Linux)   tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" ./* ;;
          esac

      # archive: false uploads the file as it is, so the download isn't a zip in a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.archive }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - run: ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
